<svg xmlns="http://w3.org" viewBox="0 0 840 310" width="840" height="310">
  <defs>
    <clipPath id="window-clip">
      <rect width="840" height="310" rx="10" />
    </clipPath>
    <clipPath id="marquee-clip">
      <rect x="0" y="265" width="840" height="45" />
    </clipPath>
  </defs>

  <style>
    .bg { fill: #0a0c10; }
    .header { fill: #12151c; }
    .border { fill: none; stroke: #21262d; stroke-width: 2; }
    .line { stroke: #1b1f27; stroke-width: 1; }
    .font { font-family: Consolas, Menlo, Monaco, monospace; }
    .title-bar { fill: #484f58; font-size: 12px; }
    .prompt-user { fill: #ff3e3e; font-size: 15px; font-weight: bold; }
    .prompt-cmd { fill: #c9d1d9; font-size: 15px; }
    .hero { fill: #f0f6fc; font-size: 54px; font-weight: bold; letter-spacing: 1px; }
    .cursor { fill: #ff3e3e; animation: blink 1s step-end infinite; }
    .sub { fill: #8b949e; font-size: 14.5px; }
    .accent { fill: #ff3e3e; font-weight: bold; }
    .highlight { fill: #e6edf3; }
    .status-dot { fill: #3fb950; animation: pulse 2.2s ease-in-out infinite; }
    .marquee-bg { fill: #0d1016; }
    .marquee-track { animation: scroll 22s linear infinite; }
    .marquee-text { fill: #6e7681; font-size: 13px; letter-spacing: 1.5px; }
    .sep { fill: #ff3e3e; font-weight: bold; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-950px); }
    }
  </style>

  <g clip-path="url(#window-clip)">
    <rect width="840" height="310" class="bg" />
    <rect width="840" height="36" class="header" />
    <line x1="0" y1="36" x2="840" y2="36" class="line" />
    
    <circle cx="22" cy="18" r="5.5" fill="#ff5f56" />
    <circle cx="40" cy="18" r="5.5" fill="#ffbd2e" />
    <circle cx="58" cy="18" r="5.5" fill="#27c93f" />
    <text x="420" y="22" text-anchor="middle" class="font title-bar">nsxpl@dev: ~</text>

    <text x="38" y="78" class="font">
      <tspan class="prompt-user">nsxpl@dev:~$ </tspan>
      <tspan class="prompt-cmd">./hello.sh</tspan>
    </text>

    <text x="38" y="148" class="font hero">hello, nsxpl.</text>
    <rect x="485" y="103" width="16" height="52" class="cursor" />

    <text x="38" y="196" class="font sub">
      <tspan class="accent">&gt;</tspan> software developer - backend, bots, automation
    </text>
    
    <circle cx="44" cy="222" r="4.5" class="status-dot" />
    <text x="58" y="227" class="font sub">
      open for projects - tg <tspan class="highlight">@oeged</tspan>
    </text>

    <rect x="0" y="265" width="840" height="45" class="marquee-bg" />
    <line x1="0" y1="265" x2="840" y2="265" class="line" />

    <g clip-path="url(#marquee-clip)">
      <g class="marquee-track">
        <text x="0" y="292" class="font marquee-text">
          python <tspan class="sep">//</tspan> c# <tspan class="sep">//</tspan> aiogram <tspan class="sep">//</tspan> fastapi <tspan class="sep">//</tspan> postgresql <tspan class="sep">//</tspan> docker <tspan class="sep">//</tspan> linux <tspan class="sep">//</tspan> automation <tspan class="sep">//</tspan> parsers <tspan class="sep">//</tspan> api <tspan class="sep">//</tspan>
        </text>
        <text x="950" y="292" class="font marquee-text">
          python <tspan class="sep">//</tspan> c# <tspan class="sep">//</tspan> aiogram <tspan class="sep">//</tspan> fastapi <tspan class="sep">//</tspan> postgresql <tspan class="sep">//</tspan> docker <tspan class="sep">//</tspan> linux <tspan class="sep">//</tspan> automation <tspan class="sep">//</tspan> parsers <tspan class="sep">//</tspan> api <tspan class="sep">//</tspan>
        </text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="838" height="308" rx="10" class="border" />
</svg>

