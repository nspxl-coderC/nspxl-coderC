<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310">
  <defs>
    <clipPath id="window-clip">
      <rect width="840" height="310" rx="10" />
    </clipPath>
    <clipPath id="marquee-clip">
      <rect x="0" y="265" width="840" height="45" />
    </clipPath>
  </defs>

  <g clip-path="url(#window-clip)">
    <rect width="840" height="310" fill="#0a0c10" />
    <rect width="840" height="36" fill="#12151c" />
    <line x1="0" y1="36" x2="840" y2="36" stroke="#1b1f27" stroke-width="1" />

    <circle cx="22" cy="18" r="5.5" fill="#ff5f56" />
    <circle cx="40" cy="18" r="5.5" fill="#ffbd2e" />
    <circle cx="58" cy="18" r="5.5" fill="#27c93f" />
    <text x="420" y="22" text-anchor="middle" font-family="Consolas, Menlo, Monaco, monospace" font-size="12" fill="#484f58">nsxpl@dev: ~</text>

    <text x="38" y="78" font-family="Consolas, Menlo, Monaco, monospace" font-size="15">
      <tspan fill="#ff3e3e" font-weight="bold">nsxpl@dev:~$ </tspan>
      <tspan fill="#c9d1d9">./hello.sh</tspan>
    </text>

    <text x="38" y="148" font-family="Consolas, Menlo, Monaco, monospace" font-size="54" font-weight="bold" fill="#f0f6fc" letter-spacing="1">hello, nsxpl.</text>
    
    <rect x="485" y="103" width="16" height="52" fill="#ff3e3e">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" calcMode="discrete" repeatCount="indefinite" />
    </rect>

    <text x="38" y="196" font-family="Consolas, Menlo, Monaco, monospace" font-size="14.5" fill="#8b949e">
      <tspan fill="#ff3e3e" font-weight="bold">&gt;</tspan> software developer &#183; backend, bots, automation
    </text>

    <circle cx="44" cy="222" r="4.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="227" font-family="Consolas, Menlo, Monaco, monospace" font-size="14.5" fill="#8b949e">
      open for projects &#183; tg <tspan fill="#e6edf3">@oeged</tspan>
    </text>

    <rect x="0" y="265" width="840" height="45" fill="#0d1016" />
    <line x1="0" y1="265" x2="840" y2="265" stroke="#1b1f27" stroke-width="1" />

    <g clip-path="url(#marquee-clip)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-950 0" dur="22s" repeatCount="indefinite" />
        <text x="0" y="292" font-family="Consolas, Menlo, Monaco, monospace" font-size="13" fill="#6e7681" letter-spacing="1.5">
          python <tspan fill="#ff3e3e" font-weight="bold">//</tspan> c# <tspan fill="#ff3e3e" font-weight="bold">//</tspan> aiogram <tspan fill="#ff3e3e" font-weight="bold">//</tspan> fastapi <tspan fill="#ff3e3e" font-weight="bold">//</tspan> postgresql <tspan fill="#ff3e3e" font-weight="bold">//</tspan> docker <tspan fill="#ff3e3e" font-weight="bold">//</tspan> linux <tspan fill="#ff3e3e" font-weight="bold">//</tspan> automation <tspan fill="#ff3e3e" font-weight="bold">//</tspan> parsers <tspan fill="#ff3e3e" font-weight="bold">//</tspan> api <tspan fill="#ff3e3e" font-weight="bold">//</tspan>
        </text>
        <text x="950" y="292" font-family="Consolas, Menlo, Monaco, monospace" font-size="13" fill="#6e7681" letter-spacing="1.5">
          python <tspan fill="#ff3e3e" font-weight="bold">//</tspan> c# <tspan fill="#ff3e3e" font-weight="bold">//</tspan> aiogram <tspan fill="#ff3e3e" font-weight="bold">//</tspan> fastapi <tspan fill="#ff3e3e" font-weight="bold">//</tspan> postgresql <tspan fill="#ff3e3e" font-weight="bold">//</tspan> docker <tspan fill="#ff3e3e" font-weight="bold">//</tspan> linux <tspan fill="#ff3e3e" font-weight="bold">//</tspan> automation <tspan fill="#ff3e3e" font-weight="bold">//</tspan> parsers <tspan fill="#ff3e3e" font-weight="bold">//</tspan> api <tspan fill="#ff3e3e" font-weight="bold">//</tspan>
        </text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="838" height="308" rx="10" fill="none" stroke="#21262d" stroke-width="2" />
</svg>
